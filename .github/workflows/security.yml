name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-policy:
    name: Actions Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify workflow supply-chain policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          sha = re.compile(r"^[0-9a-fA-F]{40}$")
          uses_line = re.compile(r"^\s*-?\s*uses:\s*([^\s#]+)")
          failures = []

          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')
              if not re.search(r"(?m)^permissions:\s*\{\}\s*$", text):
                  failures.append(f"{path}: missing top-level permissions: {{}}")
              if re.search(r"(?m)^\s*pull_request_target\s*:", text):
                  failures.append(f"{path}: pull_request_target is forbidden")

              for number, line in enumerate(text.splitlines(), 1):
                  match = uses_line.match(line)
                  if not match:
                      continue
                  value = match.group(1).strip('"\'')
                  if value.startswith('./') or value.startswith('docker://'):
                      continue
                  if '@' not in value:
                      failures.append(f"{path}:{number}: action reference has no immutable revision: {value}")
                      continue
                  revision = value.rsplit('@', 1)[1]
                  if not sha.fullmatch(revision):
                      failures.append(f"{path}:{number}: action is not pinned to a full commit SHA: {value}")

          if failures:
              print('\n'.join(failures), file=sys.stderr)
              sys.exit(1)
          PY

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
