name: R6.9 Presentation State Research

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r6.9-presentation-state.yml'
      - 'DiskUsageTests/FolderUsageTests.swift'

permissions: {}

concurrency:
  group: r6-9-presentation-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout exact research head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Prepare research-only result paths
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BASELINE_SHA: 695384f3a5c0a475f3b8292e8f3530ba841e448e
        run: |
          set -euo pipefail

          head="$(git rev-parse HEAD)"
          echo "research_head=${head}"
          echo "production_baseline=${BASELINE_SHA}"
          test "${head}" = "${EXPECTED_HEAD}"
          git cat-file -e "${BASELINE_SHA}^{commit}"

          marker="$RUNNER_TEMP/r69-research-enabled"
          results="$RUNNER_TEMP/r69-results.log"
          : > "$marker"
          : > "$results"

          rm -f /tmp/diskusage-r69-research-enabled /tmp/diskusage-r69-results.log
          ln -s "$marker" /tmp/diskusage-r69-research-enabled
          ln -s "$results" /tmp/diskusage-r69-results.log

          echo "R69_RESULTS=$results" >> "$GITHUB_ENV"
          echo "R69_DERIVED=$RUNNER_TEMP/r69-derived" >> "$GITHUB_ENV"

          sw_vers
          xcodebuild -version

      - name: Build outside measured intervals
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project DiskUsage.xcodeproj \
            -scheme DiskUsage \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$R69_DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Measure presentation-state responsiveness
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project DiskUsage.xcodeproj \
            -scheme DiskUsage \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$R69_DERIVED" \
            -only-testing:DiskUsageTests/FolderUsageTests/testR69PresentationStateResponsivenessResearch \
            -only-testing:DiskUsageTests/FolderUsageTests/testR69PresentationStateSupersessionResearch \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building

      - name: Summarize research evidence
        shell: bash
        run: |
          set -euo pipefail
          cat "$R69_RESULTS"

          R69_RESULTS="$R69_RESULTS" python3 - <<'PY'
          import os
          import re
          import statistics

          path = os.environ["R69_RESULTS"]
          idle_pattern = re.compile(
              r"R69_IDLE label=(\S+) heartbeat_samples=(\d+) "
              r"heartbeat_median_ms=([0-9.]+) heartbeat_p95_ms=([0-9.]+) "
              r"heartbeat_max_ms=([0-9.]+)"
          )
          state_pattern = re.compile(
              r"R69_STATE label=(\S+) round=(\d+) completion_s=([0-9.]+) "
              r"heartbeat_samples=(\d+) heartbeat_median_ms=([0-9.]+) "
              r"heartbeat_p95_ms=([0-9.]+) heartbeat_max_ms=([0-9.]+) "
              r"output_events=(\d+) preparing_events=(\d+)"
          )

          idle = {}
          states = {}
          supersession = False

          with open(path, encoding="utf-8") as handle:
              for raw in handle:
                  line = raw.strip()
                  if match := idle_pattern.fullmatch(line):
                      idle[match.group(1)] = {
                          "samples": int(match.group(2)),
                          "median_ms": float(match.group(3)),
                          "p95_ms": float(match.group(4)),
                          "max_ms": float(match.group(5)),
                      }
                      continue
                  if match := state_pattern.fullmatch(line):
                      label = match.group(1)
                      states.setdefault(label, []).append({
                          "round": int(match.group(2)),
                          "completion_s": float(match.group(3)),
                          "samples": int(match.group(4)),
                          "median_ms": float(match.group(5)),
                          "p95_ms": float(match.group(6)),
                          "max_ms": float(match.group(7)),
                          "output_events": int(match.group(8)),
                          "preparing_events": int(match.group(9)),
                      })
                      continue
                  if line == "R69_SUPERSESSION result=pass final_count=1":
                      supersession = True
                      continue
                  raise SystemExit(f"Unrecognized R6.9 result line: {line}")

          if set(idle) != {"idle-before", "idle-after"}:
              raise SystemExit(f"Unexpected idle labels: {sorted(idle)}")

          expected = {"tree", "search-broad", "largest-files", "sunburst"}
          if set(states) != expected:
              raise SystemExit(f"Unexpected state labels: {sorted(states)}")

          for label in sorted(expected):
              rows = sorted(states[label], key=lambda row: row["round"])
              if [row["round"] for row in rows] != [1, 2, 3, 4, 5]:
                  raise SystemExit(f"Unexpected rounds for {label}")
              if any(row["samples"] <= 0 for row in rows):
                  raise SystemExit(f"Missing heartbeat samples for {label}")
              if any(row["output_events"] <= 0 or row["preparing_events"] <= 0 for row in rows):
                  raise SystemExit(f"Missing observer delivery for {label}")

              print(
                  "R69_SUMMARY "
                  f"label={label} "
                  f"completion_median_s={statistics.median(row['completion_s'] for row in rows):.6f} "
                  f"completion_mean_s={statistics.mean(row['completion_s'] for row in rows):.6f} "
                  f"heartbeat_median_of_p95_ms={statistics.median(row['p95_ms'] for row in rows):.3f} "
                  f"heartbeat_max_ms={max(row['max_ms'] for row in rows):.3f}"
              )

          print(
              "R69_IDLE_SUMMARY "
              f"p95_before_ms={idle['idle-before']['p95_ms']:.3f} "
              f"max_before_ms={idle['idle-before']['max_ms']:.3f} "
              f"p95_after_ms={idle['idle-after']['p95_ms']:.3f} "
              f"max_after_ms={idle['idle-after']['max_ms']:.3f}"
          )

          if not supersession:
              raise SystemExit("Missing successful supersession evidence")
          print("R69_SUPERSESSION_SUMMARY result=pass")
          PY

      - name: Confirm research artifacts remain ephemeral
        shell: bash
        run: |
          set -euo pipefail

          rm -f /tmp/diskusage-r69-research-enabled /tmp/diskusage-r69-results.log

          echo "research_status:"
          git status --short
          test -z "$(git status --short)"

          echo "R6.9 result logs and DerivedData remained under RUNNER_TEMP only."
