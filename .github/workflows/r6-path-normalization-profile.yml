name: R6 Path Normalization Comparison

on:
  push:
    branches: ['r6/path-normalization']
    paths:
      - '.github/workflows/r6-path-normalization-profile.yml'
      - 'DiskScanner.swift'
      - 'DiskUsageTests/DiskScannerTests.swift'
  workflow_dispatch:

permissions: {}

concurrency:
  group: r6-path-normalization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: read

    env:
      BASE_SHA: 10d80e7913b18f9c0f4e9d65bca40f5df5687299

    steps:
      - name: Checkout candidate with baseline history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Preserve candidate regression tests
        shell: bash
        run: |
          set -euo pipefail
          cp DiskUsageTests/DiskScannerTests.swift "$RUNNER_TEMP/DiskScannerTests-R6.3.swift"
          echo "candidate_sha=$GITHUB_SHA"
          echo "baseline_sha=$BASE_SHA"

      - name: Prove focused regressions against unchanged baseline scanner
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          cp "$RUNNER_TEMP/DiskScannerTests-R6.3.swift" DiskUsageTests/DiskScannerTests.swift

          xcodebuild \
            -project DiskUsage.xcodeproj \
            -scheme DiskUsage \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/R63BaselineSemantics" \
            -only-testing:DiskUsageTests/DiskScannerTests/testScannerPublishesStandardizedPathsForLexicalRoot \
            -only-testing:DiskUsageTests/DiskScannerTests/testDirectorySymlinkDoesNotDuplicateTargetTraversal \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Restore exact candidate and run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git checkout --detach "$GITHUB_SHA"

          xcodebuild \
            -project DiskUsage.xcodeproj \
            -scheme DiskUsage \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/R63CandidateSemantics" \
            -only-testing:DiskUsageTests/DiskScannerTests/testScannerPublishesStandardizedPathsForLexicalRoot \
            -only-testing:DiskUsageTests/DiskScannerTests/testDirectorySymlinkDoesNotDuplicateTargetTraversal \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Detect scanner runtime delta
        id: delta
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- DiskScanner.swift; then
            echo 'profile=false' >> "$GITHUB_OUTPUT"
            echo 'No DiskScanner.swift delta yet; focused baseline/candidate semantics verification is sufficient for this run.'
          else
            echo 'profile=true' >> "$GITHUB_OUTPUT"
            echo 'DiskScanner.swift changed; running same-runner before/after profiling.'
          fi

      - name: Capture same-runner baseline and candidate Time Profiler evidence
        if: steps.delta.outputs.profile == 'true'
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATE_SHA="$GITHUB_SHA"
          export CANDIDATE_SHA

          cat > "$RUNNER_TEMP/r63-profile-variant.sh" <<'SH'
          #!/bin/bash
          set -euo pipefail

          variant="$1"
          ref="$2"
          derived="$RUNNER_TEMP/R63ProfileDerivedData-${variant}"
          phase_out="$RUNNER_TEMP/r63-${variant}-phases.tsv"
          duration_out="$RUNNER_TEMP/r63-${variant}-durations.txt"
          : > "$phase_out"
          : > "$duration_out"

          git reset --hard
          git checkout --detach "$ref"

          xcodebuild \
            -project DiskUsage.xcodeproj \
            -scheme DiskUsage \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

          for round in 1 2 3; do
            test_log="$RUNNER_TEMP/r63-${variant}-test-${round}.log"
            trace="$RUNNER_TEMP/r63-${variant}-${round}.trace"
            xml="$RUNNER_TEMP/r63-${variant}-${round}.xml"

            echo "=== variant=${variant} profile_round=${round} ref=${ref} ==="

            for _ in {1..100}; do
              if ! pgrep -x DiskUsage >/dev/null 2>&1; then
                break
              fi
              sleep 0.1
            done

            xcodebuild \
              -project DiskUsage.xcodeproj \
              -scheme DiskUsage \
              -configuration Debug \
              -destination 'platform=macOS' \
              -derivedDataPath "$derived" \
              -only-testing:DiskUsageTests/DiskScannerTests/testDiskScannerDisposableFilesystemSyntheticPerformance \
              -test-iterations 8 \
              CODE_SIGNING_ALLOWED=NO \
              test-without-building >"$test_log" 2>&1 &
            test_pid=$!

            app_pid=""
            for _ in {1..300}; do
              app_pid="$(pgrep -x DiskUsage | tail -n 1 || true)"
              if [[ -n "$app_pid" ]]; then
                break
              fi
              if ! kill -0 "$test_pid" 2>/dev/null; then
                break
              fi
              sleep 0.1
            done

            if [[ -z "$app_pid" ]]; then
              echo "::error::DiskUsage test host did not become available for ${variant} round ${round}."
              cat "$test_log"
              wait "$test_pid"
              exit 1
            fi

            profile_status=0
            xcrun xctrace record \
              --template 'Time Profiler' \
              --attach "$app_pid" \
              --time-limit 10s \
              --output "$trace" \
              --no-prompt || profile_status=$?

            test_status=0
            wait "$test_pid" || test_status=$?

            grep -E 'testDiskScannerDisposableFilesystemSyntheticPerformance.*passed|TEST (SUCCEEDED|FAILED)' "$test_log" || true

            if [[ "$test_status" -ne 0 ]]; then
              echo "::error::Scanner performance test failed for ${variant} round ${round} with status ${test_status}."
              exit "$test_status"
            fi
            if [[ "$profile_status" -ne 0 ]]; then
              echo "::error::xctrace attach failed for ${variant} round ${round} with status ${profile_status}."
              exit "$profile_status"
            fi

            xcrun xctrace export \
              --input "$trace" \
              --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' \
              --output "$xml"

            PROFILE_XML="$xml" PROFILE_ROUND="$round" PROFILE_VARIANT="$variant" PROFILE_OUT="$phase_out" TEST_LOG="$test_log" DURATION_OUT="$duration_out" python3 - <<'PY'
          import collections
          import os
          import re
          import xml.etree.ElementTree as ET

          root = ET.parse(os.environ["PROFILE_XML"]).getroot()
          by_id = {element.get("id"): element for element in root.iter() if element.get("id")}

          def resolved(element):
              ref = element.get("ref")
              return by_id.get(ref, element) if ref else element

          def frame_name(frame):
              target = resolved(frame)
              return target.get("name") or target.get("label") or (target.text or "").strip()

          phase_patterns = {
              "filesystem_enumeration": re.compile(r"DirectoryEnumerator|NSDirectoryEnumerator|enumerator|nextObject", re.I),
              "resource_values": re.compile(r"resourceValues|getResourceValue|NSURL.*resource|CFURL.*resource", re.I),
              "path_processing": re.compile(
                  r"standardizedFileURL|standardizedURL|deletingLastPathComponent|lastPathComponent|"
                  r"pathComponents|NSString.*lastPath|CFURL.*Path", re.I
              ),
              "node_add_file": re.compile(r"Node\.addFile", re.I),
              "folder_usage_conversion": re.compile(r"Node\.toFolderUsage", re.I),
          }
          scanner_anchor = re.compile(r"DiskScanner\.scan|Node\.(addFile|toFolderUsage)")
          nearest = collections.Counter()
          scanner_stacks = []

          for row in root.iter("row"):
              names = [name for name in (frame_name(frame) for frame in row.iter("frame")) if name]
              if not names or not any(scanner_anchor.search(name) for name in names):
                  continue
              scanner_stacks.append(names)
              nearest_phase = None
              for name in names:
                  for phase, pattern in phase_patterns.items():
                      if pattern.search(name):
                          nearest_phase = phase
                          break
                  if nearest_phase is not None:
                      break
              nearest[nearest_phase or "unclassified_scanner_stack"] += 1

          total = len(scanner_stacks)
          if not total:
              raise SystemExit("No symbolized DiskScanner/Node stacks were found")

          ordered = list(phase_patterns) + ["unclassified_scanner_stack"]
          print(f"variant={os.environ['PROFILE_VARIANT']} round={os.environ['PROFILE_ROUND']} scanner_stacks={total}")
          for phase in ordered:
              count = nearest[phase]
              print(f"  {phase}={count} ({100.0 * count / total:.2f}%)")

          with open(os.environ["PROFILE_OUT"], "a", encoding="utf-8") as handle:
              values = [os.environ["PROFILE_ROUND"], str(total)] + [str(nearest[phase]) for phase in ordered]
              handle.write("\t".join(values) + "\n")

          text = open(os.environ["TEST_LOG"], encoding="utf-8", errors="replace").read()
          durations = [float(value) for value in re.findall(
              r"testDiskScannerDisposableFilesystemSyntheticPerformance.*?\(([0-9.]+) seconds\)",
              text,
          )]
          with open(os.environ["DURATION_OUT"], "a", encoding="utf-8") as handle:
              for duration in durations:
                  handle.write(f"{duration}\n")
          print(f"testcase_duration_samples={durations}")
          PY
          done
          SH

          chmod +x "$RUNNER_TEMP/r63-profile-variant.sh"

          "$RUNNER_TEMP/r63-profile-variant.sh" baseline "$BASE_SHA"
          "$RUNNER_TEMP/r63-profile-variant.sh" candidate "$CANDIDATE_SHA"

          git reset --hard
          git checkout --detach "$CANDIDATE_SHA"

      - name: Summarize same-runner before and after evidence
        if: steps.delta.outputs.profile == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import statistics

          phases = [
              "filesystem_enumeration",
              "resource_values",
              "path_processing",
              "node_add_file",
              "folder_usage_conversion",
              "unclassified_scanner_stack",
          ]

          def load_phase(variant):
              rows = []
              path = pathlib.Path(f"{pathlib.Path.home()}")
              del path
              with open(f"{__import__('os').environ['RUNNER_TEMP']}/r63-{variant}-phases.tsv", encoding="utf-8") as handle:
                  for line in handle:
                      fields = line.rstrip("\n").split("\t")
                      rows.append([int(value) for value in fields])
              total = sum(row[1] for row in rows)
              counts = {phase: sum(row[index + 2] for row in rows) for index, phase in enumerate(phases)}
              shares = {phase: (100.0 * counts[phase] / total if total else 0.0) for phase in phases}
              return rows, total, counts, shares

          def load_durations(variant):
              path = f"{__import__('os').environ['RUNNER_TEMP']}/r63-{variant}-durations.txt"
              with open(path, encoding="utf-8") as handle:
                  return [float(line.strip()) for line in handle if line.strip()]

          before_rows, before_total, before_counts, before = load_phase("baseline")
          after_rows, after_total, after_counts, after = load_phase("candidate")

          print("=== pooled nearest-labeled-phase comparison ===")
          print(f"baseline_scanner_stacks={before_total}")
          print(f"candidate_scanner_stacks={after_total}")
          for phase in phases:
              delta = after[phase] - before[phase]
              print(
                  f"{phase}: baseline={before[phase]:.2f}% ({before_counts[phase]}), "
                  f"candidate={after[phase]:.2f}% ({after_counts[phase]}), delta_pp={delta:+.2f}"
              )

          for variant in ("baseline", "candidate"):
              durations = load_durations(variant)
              if durations:
                  print(
                      f"{variant}_testcase_duration_samples={len(durations)} "
                      f"median={statistics.median(durations):.3f}s "
                      f"mean={statistics.fmean(durations):.3f}s "
                      f"min={min(durations):.3f}s max={max(durations):.3f}s"
                  )
              else:
                  print(f"{variant}_testcase_duration_samples=0")
          PY

      - name: Confirm raw profiler evidence stays ephemeral
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo 'No trace/XML artifact is uploaded or committed; all profiling files remain under RUNNER_TEMP.'
