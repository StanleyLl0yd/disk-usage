name: R6 Retained Snapshot Control

on:
  push:
    branches: ['r6/allocation-retention']
    paths:
      - '.github/workflows/r6-allocation-retention-probe.yml'
      - 'DiskUsageTests/DiskScannerTests.swift'
  workflow_dispatch:

permissions: {}

concurrency:
  group: r6-allocation-retention-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Build research test bundle
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project DiskUsage.xcodeproj \
            -scheme DiskUsage \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/R64ControlDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Compare retained-snapshot RSS with and without cancel-rescan
        shell: bash
        run: |
          set -euo pipefail

          sample_case() {
            local test_name="$1"
            local label="$2"
            local test_log="$RUNNER_TEMP/r64-${label}.log"
            local samples="$RUNNER_TEMP/r64-${label}.tsv"
            : > "$samples"

            xcodebuild \
              -project DiskUsage.xcodeproj \
              -scheme DiskUsage \
              -configuration Debug \
              -destination 'platform=macOS' \
              -derivedDataPath "$RUNNER_TEMP/R64ControlDerivedData" \
              "-only-testing:DiskUsageTests/DiskScannerTests/${test_name}" \
              CODE_SIGNING_ALLOWED=NO \
              test-without-building >"$test_log" 2>&1 &
            local test_pid=$!

            local app_pid=""
            for _ in {1..300}; do
              app_pid="$(pgrep -x DiskUsage | tail -n 1 || true)"
              if [[ -n "$app_pid" ]]; then
                break
              fi
              if ! kill -0 "$test_pid" 2>/dev/null; then
                break
              fi
              sleep 0.1
            done

            if [[ -z "$app_pid" ]]; then
              echo "::error::DiskUsage host did not become available for $label."
              cat "$test_log"
              wait "$test_pid"
              return 1
            fi

            local index=0
            while kill -0 "$test_pid" 2>/dev/null; do
              local rss
              rss="$(ps -o rss= -p "$app_pid" 2>/dev/null | tr -d ' ' || true)"
              if [[ "$rss" =~ ^[0-9]+$ ]]; then
                printf '%d\t%s\n' "$index" "$rss" >> "$samples"
                index=$((index + 1))
              fi
              sleep 0.20
            done

            local status=0
            wait "$test_pid" || status=$?
            grep -E "${test_name}.*passed|TEST (SUCCEEDED|FAILED)" "$test_log" || true
            if [[ "$status" -ne 0 ]]; then
              cat "$test_log"
              return "$status"
            fi

            LABEL="$label" SAMPLES="$samples" python3 - <<'PY'
          import json
          import os
          import statistics

          label = os.environ["LABEL"]
          values = []
          with open(os.environ["SAMPLES"], encoding="utf-8") as handle:
              for line in handle:
                  _, rss = line.rstrip("\n").split("\t")
                  values.append(int(rss))

          if len(values) < 8:
              raise SystemExit(f"Too few RSS samples for {label}: {len(values)}")

          # Use the final second as the matched retained-snapshot hold window.
          hold_count = min(5, len(values))
          hold = values[-hold_count:]
          summary = {
              "label": label,
              "samples": len(values),
              "rss_kib_max": max(values),
              "rss_kib_final": values[-1],
              "hold_samples": hold_count,
              "hold_median_kib": statistics.median(hold),
              "hold_min_kib": min(hold),
              "hold_max_kib": max(hold),
          }
          with open(f"/Users/runner/work/_temp/r64-{label}-summary.json", "w", encoding="utf-8") as out:
              json.dump(summary, out)
          print(f"=== {label} retained-snapshot RSS ===")
          for key, value in summary.items():
              print(f"{key}={value}")
          PY
          }

          sample_case testLargeDisposableSingleViewModelScanMemoryResearch control-r1
          sample_case testLargeDisposableCancelRescanMemoryResearch lifecycle-r1

          sample_case testLargeDisposableCancelRescanMemoryResearch lifecycle-r2
          sample_case testLargeDisposableSingleViewModelScanMemoryResearch control-r2

          sample_case testLargeDisposableSingleViewModelScanMemoryResearch control-r3
          sample_case testLargeDisposableCancelRescanMemoryResearch lifecycle-r3

          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path

          base = Path("/Users/runner/work/_temp")
          keys = ("rss_kib_final", "hold_median_kib", "rss_kib_max")
          deltas = {key: [] for key in keys}

          print("=== retained-snapshot paired comparisons ===")
          for round_number in (1, 2, 3):
              control = json.loads((base / f"r64-control-r{round_number}-summary.json").read_text())
              lifecycle = json.loads((base / f"r64-lifecycle-r{round_number}-summary.json").read_text())
              print(f"round={round_number}")
              for key in keys:
                  delta = lifecycle[key] - control[key]
                  deltas[key].append(delta)
                  print(f"{key}_control={control[key]}")
                  print(f"{key}_lifecycle={lifecycle[key]}")
                  print(f"{key}_delta_kib={delta:+.1f}")

          print("=== retained-snapshot delta summary ===")
          for key in keys:
              values = deltas[key]
              print(f"{key}_deltas_kib={values}")
              print(f"{key}_delta_mean_kib={statistics.fmean(values):+.1f}")
              print(f"{key}_delta_median_kib={statistics.median(values):+.1f}")
              print(f"{key}_delta_min_kib={min(values):+.1f}")
              print(f"{key}_delta_max_kib={max(values):+.1f}")
          PY

      - name: Confirm research evidence stays ephemeral
        if: always()
        run: echo 'No RSS samples or test logs are uploaded or committed.'
