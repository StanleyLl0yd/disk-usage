name: R6 Allocation Retention Measurement

on:
  push:
    branches: ['r6/allocation-retention']
    paths:
      - '.github/workflows/r6-allocation-retention-probe.yml'
      - 'DiskUsageTests/DiskScannerTests.swift'
  workflow_dispatch:

permissions: {}

concurrency:
  group: r6-allocation-retention-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Report runner and toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          uname -m
          xcrun xctrace list templates | grep -F 'Allocations'

      - name: Build scanner test bundle outside measurement
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project DiskUsage.xcodeproj \
            -scheme DiskUsage \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/R64DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Run XCTest memory metric baseline
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/r64-memory-metric.log"
          xcodebuild \
            -project DiskUsage.xcodeproj \
            -scheme DiskUsage \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/R64DerivedData" \
            -only-testing:DiskUsageTests/DiskScannerTests/testDiskScannerDisposableFilesystemSyntheticMemoryPerformance \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building 2>&1 | tee "$log"

          echo '=== memory metric lines ==='
          grep -Ei 'memory|XCTMemoryMetric|Physical Memory|kB|MB' "$log" | tail -n 80 || true

      - name: Sample repeated-scan test-host RSS without profiler attachment
        shell: bash
        run: |
          set -euo pipefail

          test_log="$RUNNER_TEMP/r64-rss-test.log"
          samples="$RUNNER_TEMP/r64-rss.tsv"
          : > "$samples"

          xcodebuild \
            -project DiskUsage.xcodeproj \
            -scheme DiskUsage \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/R64DerivedData" \
            -only-testing:DiskUsageTests/DiskScannerTests/testDiskScannerDisposableFilesystemSyntheticPerformance \
            -test-iterations 8 \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building >"$test_log" 2>&1 &
          test_pid=$!

          app_pid=""
          for _ in {1..300}; do
            app_pid="$(pgrep -x DiskUsage | tail -n 1 || true)"
            if [[ -n "$app_pid" ]]; then
              break
            fi
            if ! kill -0 "$test_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done

          if [[ -z "$app_pid" ]]; then
            echo "::error::DiskUsage test host did not become available."
            cat "$test_log"
            wait "$test_pid"
            exit 1
          fi

          echo "sampled_pid=$app_pid"
          index=0
          while kill -0 "$test_pid" 2>/dev/null; do
            rss="$(ps -o rss= -p "$app_pid" 2>/dev/null | tr -d ' ' || true)"
            if [[ "$rss" =~ ^[0-9]+$ ]]; then
              printf '%d\t%s\n' "$index" "$rss" >> "$samples"
              index=$((index + 1))
            fi
            sleep 0.25
          done

          test_status=0
          wait "$test_pid" || test_status=$?
          grep -E 'testDiskScannerDisposableFilesystemSyntheticPerformance.*passed|TEST (SUCCEEDED|FAILED)' "$test_log" || true
          if [[ "$test_status" -ne 0 ]]; then
            echo "::error::Repeated scanner performance test failed with status $test_status."
            exit "$test_status"
          fi

          SAMPLES="$samples" python3 - <<'PY'
          import os
          import statistics

          values = []
          with open(os.environ["SAMPLES"], encoding="utf-8") as handle:
              for line in handle:
                  _, rss = line.rstrip("\n").split("\t")
                  values.append(int(rss))

          if len(values) < 8:
              raise SystemExit(f"Too few RSS samples: {len(values)}")

          ordered = sorted(values)
          p95 = ordered[min(len(ordered) - 1, int(round(0.95 * (len(ordered) - 1))))]
          q = max(1, len(values) // 4)
          first = values[:q]
          last = values[-q:]

          print("=== repeated-scan test-host RSS ===")
          print(f"samples={len(values)}")
          print(f"rss_kib_min={min(values)}")
          print(f"rss_kib_median={statistics.median(values):.1f}")
          print(f"rss_kib_p95={p95}")
          print(f"rss_kib_max={max(values)}")
          print(f"rss_kib_final={values[-1]}")
          print(f"first_quartile_median_kib={statistics.median(first):.1f}")
          print(f"last_quartile_median_kib={statistics.median(last):.1f}")
          print(f"quartile_median_delta_kib={statistics.median(last)-statistics.median(first):+.1f}")
          PY

      - name: Confirm research evidence stays ephemeral
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo 'No trace, XML, RSS sample, or test-log artifact is uploaded or committed; all research files remain under RUNNER_TEMP.'
