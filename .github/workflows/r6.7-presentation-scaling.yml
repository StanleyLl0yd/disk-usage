name: R6.7 Presentation Scaling Research

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r6.7-presentation-scaling.yml'
      - 'DiskUsageTests/FolderUsageTests.swift'

permissions: {}

concurrency:
  group: r6-7-presentation-scaling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout exact research head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Verify exact research head and environment
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          echo "research_head=${actual_head}"
          test "${actual_head}" = "${EXPECTED_HEAD}"
          sw_vers
          xcodebuild -version

      - name: Build research test outside measured intervals
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project DiskUsage.xcodeproj \
            -scheme DiskUsage \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/r67-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Run large-snapshot presentation scaling matrix
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/r67-presentation-scaling.log"
          results="$RUNNER_TEMP/r67-results.log"
          link="/tmp/diskusage-r67-results.log"
          : > "$results"
          rm -f "$link"
          ln -s "$results" "$link"
          trap 'rm -f "$link"' EXIT

          xcodebuild \
            -project DiskUsage.xcodeproj \
            -scheme DiskUsage \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/r67-derived" \
            -only-testing:DiskUsageTests/FolderUsageTests/testR67LargeSnapshotPresentationScalingResearch \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building 2>&1 | tee "$log"

          echo "=== R6.7 scaling results ==="
          cat "$results"
          grep 'R67_RESULT' "$results"

      - name: Confirm research artifacts remain ephemeral
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --short)"
          echo "Research logs and DerivedData remained under RUNNER_TEMP only."
