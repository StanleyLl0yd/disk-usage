name: R6 Path Normalization Finalize

on:
  push:
    branches:
      - r6/path-normalization
    paths:
      - '.github/workflows/r6-path-normalization-finalize.yml'
      - '.github/scripts/r6-path-normalization-finalize.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Record R6.3 evidence
        run: python3 .github/scripts/r6-path-normalization-finalize.py

      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PERFORMANCE.md docs/ROADMAP.md
          git diff --cached --check
          git commit -m 'R6.3: record path standardization evidence'
          git push origin HEAD:r6/path-normalization
