name: R6 Scanner CPU Profile

on:
  push:
    branches: ['r6/scanner-cpu-profile']
    paths:
      - '.github/workflows/r6-scanner-profile.yml'
      - 'DiskUsageTests/DiskScannerTests.swift'
  workflow_dispatch:

permissions: {}

concurrency:
  group: r6-scanner-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Build scanner test bundle outside profile
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project DiskUsage.xcodeproj \
            -scheme DiskUsage \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DiskUsageProfileDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Capture repeated scanner Time Profiler evidence
        shell: bash
        run: |
          set -euo pipefail

          derived="$RUNNER_TEMP/DiskUsageProfileDerivedData"

          for round in 1 2 3; do
            test_log="$RUNNER_TEMP/scanner-profile-test-${round}.log"
            trace="$RUNNER_TEMP/scanner-time-profile-${round}.trace"
            xml="$RUNNER_TEMP/scanner-time-profile-${round}.xml"

            echo "=== profile_round=${round} ==="

            for _ in {1..100}; do
              if ! pgrep -x DiskUsage >/dev/null 2>&1; then
                break
              fi
              sleep 0.1
            done

            xcodebuild \
              -project DiskUsage.xcodeproj \
              -scheme DiskUsage \
              -configuration Debug \
              -destination 'platform=macOS' \
              -derivedDataPath "$derived" \
              -only-testing:DiskUsageTests/DiskScannerTests/testDiskScannerDisposableFilesystemSyntheticPerformance \
              -test-iterations 8 \
              CODE_SIGNING_ALLOWED=NO \
              test-without-building >"$test_log" 2>&1 &
            test_pid=$!

            app_pid=""
            for _ in {1..300}; do
              app_pid="$(pgrep -x DiskUsage | tail -n 1 || true)"
              if [[ -n "$app_pid" ]]; then
                break
              fi
              if ! kill -0 "$test_pid" 2>/dev/null; then
                break
              fi
              sleep 0.1
            done

            if [[ -z "$app_pid" ]]; then
              echo "::error::DiskUsage test host did not become available for profiling in round ${round}."
              grep -E 'testDiskScannerDisposableFilesystemSyntheticPerformance|TEST (SUCCEEDED|FAILED)' "$test_log" || true
              wait "$test_pid"
              exit 1
            fi

            echo "Profiling synthetic DiskUsage test host PID ${app_pid}; raw trace remains ephemeral."

            profile_status=0
            xcrun xctrace record \
              --template 'Time Profiler' \
              --attach "$app_pid" \
              --time-limit 10s \
              --output "$trace" \
              --no-prompt || profile_status=$?

            test_status=0
            wait "$test_pid" || test_status=$?

            grep -E 'testDiskScannerDisposableFilesystemSyntheticPerformance.*passed|TEST (SUCCEEDED|FAILED)' "$test_log" || true

            if [[ "$test_status" -ne 0 ]]; then
              echo "::error::Scanner performance test failed with status ${test_status} in round ${round}."
              exit "$test_status"
            fi

            if [[ "$profile_status" -ne 0 ]]; then
              echo "::error::xctrace attach failed with status ${profile_status} in round ${round}."
              exit "$profile_status"
            fi

            xcrun xctrace export \
              --input "$trace" \
              --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' \
              --output "$xml"

            PROFILE_XML="$xml" PROFILE_ROUND="$round" python3 - <<'PY'
          import collections
          import os
          import re
          import xml.etree.ElementTree as ET

          root = ET.parse(os.environ["PROFILE_XML"]).getroot()
          by_id = {element.get("id"): element for element in root.iter() if element.get("id")}

          def resolved(element):
              ref = element.get("ref")
              return by_id.get(ref, element) if ref else element

          def frame_name(frame):
              target = resolved(frame)
              return target.get("name") or target.get("label") or (target.text or "").strip()

          phase_patterns = {
              "filesystem_enumeration": re.compile(
                  r"DirectoryEnumerator|NSDirectoryEnumerator|enumerator|nextObject", re.I
              ),
              "resource_values": re.compile(
                  r"resourceValues|getResourceValue|NSURL.*resource|CFURL.*resource", re.I
              ),
              "path_processing": re.compile(
                  r"standardizedFileURL|standardizedURL|deletingLastPathComponent|lastPathComponent|"
                  r"pathComponents|NSString.*lastPath|CFURL.*Path", re.I
              ),
              "node_add_file": re.compile(r"Node\.addFile", re.I),
              "folder_usage_conversion": re.compile(r"Node\.toFolderUsage", re.I),
          }
          scanner_anchor = re.compile(r"DiskScanner\.scan|Node\.(addFile|toFolderUsage)")

          rows = list(root.iter("row"))
          scanner_stacks = []
          first_frames = collections.Counter()
          last_frames = collections.Counter()
          all_frames = collections.Counter()
          inclusive = collections.Counter()
          first_phase = collections.Counter()
          last_phase = collections.Counter()

          for row in rows:
              names = [name for name in (frame_name(frame) for frame in row.iter("frame")) if name]
              if not names or not any(scanner_anchor.search(name) for name in names):
                  continue

              scanner_stacks.append(names)
              first_frames[names[0]] += 1
              last_frames[names[-1]] += 1
              all_frames.update(names)

              joined = "\n".join(names)
              for phase, pattern in phase_patterns.items():
                  if pattern.search(joined):
                      inclusive[phase] += 1
                  if pattern.search(names[0]):
                      first_phase[phase] += 1
                  if pattern.search(names[-1]):
                      last_phase[phase] += 1

          print(f"profile_round={os.environ['PROFILE_ROUND']}")
          print(f"time_profile_rows={len(rows)}")
          print(f"scanner_stack_rows={len(scanner_stacks)}")
          for phase in phase_patterns:
              print(f"inclusive_stack_rows[{phase}]={inclusive[phase]}")
          for phase in phase_patterns:
              print(f"first_frame_rows[{phase}]={first_phase[phase]}")
          for phase in phase_patterns:
              print(f"last_frame_rows[{phase}]={last_phase[phase]}")

          print("top_first_frames:")
          for name, count in first_frames.most_common(25):
              print(f"  {count:6d}  {name}")

          print("top_last_frames:")
          for name, count in last_frames.most_common(25):
              print(f"  {count:6d}  {name}")

          print("top_frames_within_scanner_stacks:")
          for name, count in all_frames.most_common(30):
              print(f"  {count:6d}  {name}")

          if not scanner_stacks:
              raise SystemExit("No symbolized DiskScanner/Node stacks were found in Time Profiler export")
          PY
          done
