name: Prerelease

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.release/request.json'
      - 'scripts/package_release.sh'
  push:
    branches: [main]
    paths:
      - '.release/request.json'

permissions: {}

concurrency:
  group: prerelease-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-package:
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Reject unapproved prerelease channels
        shell: bash
        run: |
          set -euo pipefail
          approved_tag="$(plutil -extract tag raw .release/request.json)"
          version="${approved_tag%%-alpha.*}"
          for channel in beta rc; do
            request="$RUNNER_TEMP/rejected-${channel}.json"
            cp .release/request.json "$request"
            plutil -replace tag -string "${version}-${channel}.1" "$request"
            if scripts/package_release.sh "$request" "$RUNNER_TEMP/rejected-${channel}"; then
              echo "::error::Unsigned ${channel} prerelease unexpectedly passed validation."
              exit 1
            fi
          done

      - name: Verify unsigned prerelease package
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/release"
          sentinel="$output/.preserve-output-sentinel"
          mkdir -p "$output"
          printf 'preserve\n' > "$sentinel"
          scripts/package_release.sh .release/request.json "$output"
          test -f "$sentinel"

  publish:
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      checks: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for exact-main verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          required_checks=(
            "macos"
            "Actions Policy"
            "Gitleaks"
            "CodeQL Actions"
            "CodeQL Swift"
            "SonarCloud Code Analysis"
          )

          for attempt in {1..120}; do
            all_green=true
            checks_json="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")"

            for check_name in "${required_checks[@]}"; do
              state="$(jq -r --arg name "$check_name" '
                [.check_runs[] | select(.name == $name)]
                | sort_by(.started_at)
                | last
                | if . == null then "missing"
                  else (.status + "\t" + (.conclusion // ""))
                  end
              ' <<< "$checks_json")"

              if [[ "$state" == "missing" ]]; then
                all_green=false
                continue
              fi

              status="${state%%$'\t'*}"
              conclusion="${state#*$'\t'}"
              if [[ "$status" != "completed" ]]; then
                all_green=false
                continue
              fi
              if [[ "$conclusion" != "success" ]]; then
                echo "::error::Required check '${check_name}' completed with '${conclusion}'."
                exit 1
              fi
            done

            if [[ "$all_green" == "true" ]]; then
              echo "All exact-main release gates are green for ${GITHUB_SHA}."
              exit 0
            fi

            sleep 15
          done

          echo "::error::Timed out waiting for exact-main release gates for ${GITHUB_SHA}."
          exit 1

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Build and package unsigned prerelease
        run: scripts/package_release.sh .release/request.json "$RUNNER_TEMP/release"

      - name: Read release request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          tag="$(plutil -extract tag raw .release/request.json)"
          title="$(plutil -extract title raw .release/request.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Verify release target is safe
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag ${TAG} already points to ${tag_sha}; refusing to move or overwrite it."
              exit 1
            fi
            echo "Tag ${TAG} already points to exact source commit ${GITHUB_SHA}; safe to resume publication."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Create or verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${GITHUB_SHA}" >/dev/null
          fi
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag ${TAG} points to ${tag_sha}, expected ${GITHUB_SHA}."
            exit 1
          fi

      - name: Write release notes
        env:
          TAG: ${{ steps.request.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## DiskUsage ${version}

          Early alpha build for real-world testing.

          **Not Developer ID signed / not notarized:** these binaries intentionally have no Developer ID identity and are not notarized. macOS Gatekeeper may block a normal first launch. Do not disable Gatekeeper globally; follow the testing guidance in docs/RELEASE.md if you choose to run this alpha.

          - macOS 14.0+
          - universal binary: arm64 + x86_64
          - source commit: ${GITHUB_SHA}
          - artifacts: app ZIP, DMG, and SHA256SUMS
          EOF

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
          TITLE: ${{ steps.request.outputs.title }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release create "$TAG" \
            "$RUNNER_TEMP/release/DiskUsage-${version}.app.zip" \
            "$RUNNER_TEMP/release/DiskUsage-${version}.dmg" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease \
            --verify-tag

      - name: Verify published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/release-verify"
          mkdir -p "$verify_dir"
          gh release download "$TAG" --dir "$verify_dir"
          (
            cd "$verify_dir"
            shasum -a 256 -c SHA256SUMS
          )
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
          test "$tag_sha" = "$GITHUB_SHA"
          is_prerelease="$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')"
          test "$is_prerelease" = "true"
