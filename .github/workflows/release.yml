name: Prerelease

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.release/request.json'
      - 'scripts/package_release.sh'
  push:
    branches: [main]
    paths:
      - '.release/request.json'

permissions: {}

concurrency:
  group: prerelease-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-package:
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Verify unsigned prerelease package
        run: scripts/package_release.sh .release/request.json "$RUNNER_TEMP/release"

  publish:
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Build and package unsigned prerelease
        run: scripts/package_release.sh .release/request.json "$RUNNER_TEMP/release"

      - name: Read release request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          tag="$(plutil -extract tag raw .release/request.json)"
          title="$(plutil -extract title raw .release/request.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Verify release target is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists; refusing to overwrite it."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${GITHUB_SHA}" >/dev/null
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
          test "$tag_sha" = "$GITHUB_SHA"

      - name: Write release notes
        env:
          TAG: ${{ steps.request.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## DiskUsage ${version}

          Early alpha build for real-world testing after completion of R5.3.

          **Unsigned / not notarized:** these binaries intentionally have no Developer ID signature and are not notarized. macOS Gatekeeper may block a normal first launch. Do not disable Gatekeeper globally; follow the testing guidance in docs/RELEASE.md if you choose to run this alpha.

          - macOS 14.0+
          - universal binary: arm64 + x86_64
          - app version: 0.1.0 (build 1)
          - source commit: ${GITHUB_SHA}
          - artifacts: app ZIP, DMG, and SHA256SUMS

          Search/filtering and Largest Files are not part of this alpha yet; R5.4 and R5.5 remain planned.
          EOF

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
          TITLE: ${{ steps.request.outputs.title }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release create "$TAG" \
            "$RUNNER_TEMP/release/DiskUsage-${version}.app.zip" \
            "$RUNNER_TEMP/release/DiskUsage-${version}.dmg" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease \
            --verify-tag

      - name: Verify published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/release-verify"
          mkdir -p "$verify_dir"
          gh release download "$TAG" --dir "$verify_dir"
          (
            cd "$verify_dir"
            shasum -a 256 -c SHA256SUMS
          )
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
          test "$tag_sha" = "$GITHUB_SHA"
          is_prerelease="$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')"
          test "$is_prerelease" = "true"
